<!DOCTYPE html>
<html>
    <head>
        <title>Gestión de usuarios</title>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        <header-adm></header-adm>
        <div class="formulario">
            <label for="tiempoMaximo">Días maximos que un usuario puede tener un libro: </label>
            <input type="number" id="tiempoMaximo" name="tiempoMaximo"><br>
            <label for="maxLibros">Maximo de libros que un usuario puede tener: </label>
            <input type="number" id="maxLibros" name="maxLibros"><br>
            <button id="saveVaribles"><img src="../img/guardar.png"> Guardar variables</button>
        </div><br>
        
        <h1>USUARIOS REGISTRADOS</h1>
        <table id="tablaUsuarios"></table><br>
        <div class="formulario">
            <h3>Añadir usuario</h3>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre">
            <input type="password" id="pass" name="pass" placeholder="Contraseña">
            <input type="text" id="rol" name="rol" placeholder="Rol"><br>
            <button id="addUser"><img src="../img/add.png"> Crear usuario</button>
        </div><br>
        <div class="formulario">
            <label for="nombreDel">Nombre del usuario a borrar:</label>
            <input type="text" id="nombreDel" name="nombreDel"><br>
            <button id="deletUser"><img src="../img/eliminar.png"> Borrar usuario</button>
        </div><br>
        <div class="formulario">
            <label for="nombreEdit">Nombre del usuario a editar:</label>
            <input type="text" id="nombreEdit" name="nombreEdit"><br>
            <input type="text" id="passEdit" name="passEdit" placeholder="Contraseña">
            <input type="text" id="rolEdit" name="rolEdit" placeholder="Rol">
            <label>Esta penalizado?:</label>
            <input type="checkbox" id="estaPenalizado" name="estaPenalizado"> 
            <input type="number" id="numRetrasos" name="numRetrasos" placeholder="numRetrasos"><br>
            <button id="EditarUser"><img src="../img/edicion.png"> Editar usuario</button>
        </div>
        <script type="module" src="../componentes/CabeceraAdmin.js"></script>
        <script type="module" src="editorUsuarios.js"></script>
    </body>
</html>
